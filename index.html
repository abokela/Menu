<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو أبو كيلة</title>
<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--fg:#000;--mut:#666;--acc:#000;--acc-fg:#fff;--line:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
header{text-align:center;padding:18px 12px 6px}
header img{height:120px;max-width:70%;object-fit:contain}header p{margin:4px 0 0;color:var(--mut);font-size:13px}
.top{position:sticky;top:0;background:var(--bg);z-index:5;padding:8px 12px;border-bottom:1px solid var(--line)}
.top::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
input,textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:15px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:700}
main{padding:0 12px;max-width:720px;margin:0 auto}
h2{font-size:20px;margin:22px 0 8px;color:var(--acc)}h3{font-size:14px;margin:14px 0 6px;color:var(--mut)}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.it .n{flex:1;font-size:15px;line-height:1.4}.it .p{font-weight:700;color:var(--acc);white-space:nowrap}
.add,.q button{border:0;border-radius:10px;background:var(--acc);color:var(--acc-fg);font:inherit;font-weight:700;cursor:pointer}
.add{padding:8px 12px}.q{display:flex;align-items:center;gap:8px}.q button{width:32px;height:32px;font-size:18px}.q b{min-width:18px;text-align:center}
#bar{position:fixed;inset:auto 0 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none;z-index:6}
#bar button{width:100%;max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:16px;background:var(--acc);color:var(--acc-fg);padding:15px 18px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px #0004}
#sheet{position:fixed;inset:0;background:#000a;display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
.box{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.box h2{margin:0 0 10px}.row{display:flex;gap:8px;margin:10px 0}.row label{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--card)}
.row input{display:none}.row label.on{background:var(--acc);color:var(--acc-fg);font-weight:700}
.fld{margin:8px 0}.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:12px 0}
.send{width:100%;border:0;border-radius:14px;background:#000;color:#fff;padding:14px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.x{float:left;background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:30px 0}.err{color:#ff6b6b;font-size:13px;min-height:18px}
a.call{color:var(--acc)}footer{text-align:center;color:var(--mut);font-size:12px;padding:24px 12px}
</style>
</head>

var D=DEF,items=[],cart={},mode="in",active=0;
function build(){items=[];D.forEach(function(s,si){s[2].split(",").map(function(x){var a=x.split("|");items.push({id:items.length,sec:si,n:a[0],p:+a[1]})})})}
build();
/* ضعي هنا رابط الشيت المنشور بصيغة CSV (الأعمدة: القسم، الصنف، السعر) */
var SHEET_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSl20K4boMon0o2kp0hWtIvXqwEX-VgUPh65hOJSHDoWeWW5LcDA6HXZAU3asho0WBlQ5C6onj_EepT/pub?gid=2052053374&single=true&output=csv";
function csv(t){var r=[],w=[],c="",q=false,i,h;t=t.replace(/^\uFEFF/,"");for(i=0;i<t.length;i++){h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==","){w.push(c);c=""}else if(h=="\n"||h=="\r"){if(h=="\r"&&t[i+1]=="\n")i++;w.push(c);r.push(w);w=[];c=""}else c+=h}w.push(c);r.push(w);return r}
function fromCsv(t){var m={},o=[];csv(t).forEach(function(r){var s=(r[0]||"").trim(),n=(r[1]||"").trim().replace(/,/g,"،").replace(/\|/g,"/"),p=parseFloat((r[2]||"").replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-1632}));if(!s||!n||isNaN(p))return;if(!m[s]){m[s]=[s,null,[]];o.push(m[s])}m[s][2].push(n+"|"+p)});o.forEach(function(x){x[2]=x[2].join(",")});return o}
function load(){if(!SHEET_CSV)return;fetch(SHEET_CSV,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){var d=fromCsv(t);if(d.length){D=d;build();cart={};active=0;tabs();render()}}).catch(function(){})}
function ar(n){return n.toLocaleString("ar-EG")}
function $(i){return document.getElementById(i)}
function tabs(){$("tabs").innerHTML=D.map(function(s,i){return '<button data-i="'+i+'" class="'+(i===active?"on":"")+'">'+s[0]+'</button>'}).join("")}
function card(it){var q=cart[it.id]||0;return '<div class="it"><div class="n">'+it.n+'</div><div class="p">'+ar(it.p)+' ج</div>'+(q?'<div class="q"><button data-d="-1" data-id="'+it.id+'">−</button><b>'+ar(q)+'</b><button data-d="1" data-id="'+it.id+'">+</button></div>':'<button class="add" data-d="1" data-id="'+it.id+'">➕ إضافة</button>')+'</div>'}
function render(){var q=$("s").value.trim(),h="";
if(q){var r=items.filter(function(i){return i.n.indexOf(q)>-1});h=r.length?r.map(card).join(""):'<div class="empty">لا توجد نتائج</div>'}
else{D.forEach(function(s,si){h+='<h2 id="sec'+si+'">'+s[0]+'</h2>'+items.filter(function(i){return i.sec===si}).map(card).join("")})}
$("m").innerHTML=h;bar()}
function tot(){var c=0,t=0;for(var k in cart){c+=cart[k];t+=cart[k]*items[k].p}return[c,t]}
function bar(){var x=tot();$("bar").style.display=x[0]?"block":"none";$("cc").textContent=ar(x[0])+" صنف";$("ct").textContent=ar(x[1])+" ج"}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render();if($("sheet").classList.contains("show"))cartView()}
function cartView(){var x=tot(),h='<button class="x" id="cl">×</button><h2>🛒 سلتك</h2>';
if(!x[0]){h+='<div class="empty">السلة فاضية</div>'}else{
for(var k in cart){var it=items[k];h+='<div class="it"><div class="n">'+it.n+'<br><small style="color:var(--mut)">'+ar(it.p*cart[k])+' ج</small></div><div class="q"><button data-d="-1" data-id="'+k+'">−</button><b>'+ar(cart[k])+'</b><button data-d="1" data-id="'+k+'">+</button></div></div>'}
h+='<div class="tot"><span>الإجمالي</span><span>'+ar(x[1])+' ج</span></div>';
h+='<div class="row"><label class="'+(mode==="in"?"on":"")+'" data-m="in">🍽️ داخل المحل</label><label class="'+(mode==="out"?"on":"")+'" data-m="out">🛵 توصيل للمنزل</label></div>';
var v=function(i){var e=$(i);return e?e.value:""};var keep={t:v("ft"),n:v("fn"),a:v("fa"),o:v("fo")};
if(mode==="in")h+='<div class="fld"><input id="ft" placeholder="رقم الطاولة" value="'+keep.t+'"></div>';
else h+='<div class="fld"><input id="fn" placeholder="الاسم" value="'+keep.n+'"></div><div class="fld"><input id="fa" placeholder="العنوان بالتفصيل" value="'+keep.a+'"></div>';
h+='<div class="fld"><textarea id="fo" rows="2" placeholder="ملاحظات على الطلب (اختياري)">'+keep.o+'</textarea></div><div class="err" id="er"></div><button class="send" id="sd">📲 إرسال الطلب عبر واتساب</button>'}
$("box").innerHTML=h;$("sheet").classList.add("show")}
function send(){var g=function(i){var e=$(i);return e?e.value.trim():""},er=$("er");
if(mode==="in"&&!g("ft")){er.textContent="من فضلك اكتب رقم الطاولة";return}
if(mode==="out"&&(!g("fn")||!g("fa"))){er.textContent="من فضلك اكتب الاسم والعنوان";return}
var L=["🧾 *طلب جديد - أبو كيلة*","━━━━━━━━━━━━"],x=tot(),n=1;
for(var k in cart){var it=items[k];L.push(n++ +". "+it.n+" × "+cart[k]+" = "+(it.p*cart[k])+" ج")}
L.push("━━━━━━━━━━━━","💰 *الإجمالي: "+x[1]+" ج*","");
if(mode==="in")L.push("🍽️ داخل المحل - طاولة رقم: "+g("ft"));else L.push("🛵 توصيل للمنزل","👤 الاسم: "+g("fn"),"📍 العنوان: "+g("fa"));

window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(L.join("\n")),"_blank")}

else if(t.dataset.m){mode=t.dataset.m;cartView()}
else if(t.id==="cb")cartView();else if(t.id==="cl")$("sheet").classList.remove("show");else if(t.id==="sd")send()});
